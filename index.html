<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Niruu 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Pure Soft Light Cream & Warm Yellow Background */
            background: linear-gradient(135deg, #fffdf5 0%, #fff8dc 50%, #ffefba 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', 'Trebuchet MS', sans-serif;
            color: #5c4318;
            position: relative;
        }

        /* Screen Containers */
        .scene {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        .scene.active {
            display: flex;
            animation: fadeIn 0.7s ease forwards;
        }

        /* 1. Opening 10-Second Countdown */
        .countdown-circle {
            width: 165px;
            height: 165px;
            border-radius: 50%;
            background: #fffef9;
            border: 3px dashed #e6a817;
            box-shadow: 0 10px 30px rgba(230, 168, 23, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulse 1s infinite ease-in-out;
        }

        #main-timer {
            font-size: 4.5rem;
            color: #d48806;
            font-weight: bold;
        }

        /* 2. Boom Effect + 3-Second Pause */
        .boom-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fire-emoji {
            font-size: 6.5rem;
            animation: boomPop 0.7s ease-out forwards;
            z-index: 2;
        }

        .boom-ring {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 4px solid #f59f00;
            border-radius: 50%;
            animation: ringExpand 0.8s ease-out forwards;
            z-index: 1;
        }

        #wait-timer {
            margin-top: 25px;
            font-size: 1.8rem;
            color: #b87300;
            font-weight: bold;
        }

        /* 3. Birthday Reveal Card */
        .note-card {
            background: #fffef9;
            padding: 40px 25px;
            border-radius: 22px;
            border: 2px solid #f2d06b;
            outline: 2px dashed #f5de93;
            outline-offset: -10px;
            box-shadow: 0 12px 35px rgba(184, 134, 11, 0.14);
            max-width: 480px;
            width: 92%;
            position: relative;
        }

        .emoji-line {
            font-size: 1.9rem;
            letter-spacing: 10px;
            margin: 8px 0;
        }

        .date-box {
            font-size: 1.55rem;
            color: #9c640c;
            background: #fff9db;
            padding: 15px 12px;
            border-radius: 12px;
            margin: 18px 0;
            border: 1px solid #fae39c;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        #next-btn {
            margin-top: 15px;
            padding: 12px 40px;
            font-size: 1.15rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #f59f00, #e67700);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(245, 159, 0, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #next-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(245, 159, 0, 0.5);
        }

        /* 4. Final Birthday Screen */
        .final-card {
            background: #fffef9;
            padding: 45px 30px;
            border-radius: 26px;
            border: 3px solid #f5b82e;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.35), 0 12px 30px rgba(184, 134, 11, 0.15);
            max-width: 500px;
            width: 92%;
            animation: floatCard 3s ease-in-out infinite;
        }

        .final-message {
            font-size: 2.3rem;
            color: #9c5708;
            line-height: 1.4;
            text-shadow: 0 2px 12px rgba(255, 212, 59, 0.6);
        }

        .sparkles {
            margin-top: 14px;
            font-size: 1.5rem;
            letter-spacing: 8px;
        }

        /* Floating Balloons & Sunflowers */
        #bg-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .floating {
            position: absolute;
            bottom: -60px;
            animation: floatUp linear infinite;
        }

        .sunflower {
            font-size: 1.1rem;
            opacity: 0.32;
        }

        .balloon {
            font-size: 2.1rem;
            opacity: 0.78;
        }

        /* Keyframe Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        @keyframes boomPop {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.6); opacity: 1; }
            100% { transform: scale(1.25); opacity: 1; }
        }

        @keyframes ringExpand {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(4); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-55vh) rotate(10deg); }
            100% { transform: translateY(-115vh) rotate(-10deg); }
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Mobile Responsive */
        @media (max-width: 550px) {
            .countdown-circle { width: 135px; height: 135px; }
            #main-timer { font-size: 3.5rem; }
            .date-box { font-size: 1.15rem; padding: 12px 8px; }
            .final-message { font-size: 1.8rem; }
            .note-card, .final-card { padding: 32px 18px; }
        }
    </style>
</head>
<body>

    <!-- Background Floating Container -->
    <div id="bg-stage"></div>

    <!-- Screen 1: 10s Countdown -->
    <div id="scene-countdown" class="scene active">
        <div class="countdown-circle">
            <span id="main-timer">10</span>
        </div>
    </div>

    <!-- Screen 2: Boom Animation -->
    <div id="scene-boom" class="scene">
        <div class="boom-wrapper">
            <div class="boom-ring"></div>
            <div class="fire-emoji">💣👀</div>
        </div>
        <p id="wait-timer">3</p>
    </div>

    <!-- Screen 3: Date & Time Reveal -->
    <div id="scene-reveal" class="scene">
        <div class="note-card">
            <div class="emoji-line">🎈 🎀 🎈</div>
            <div class="date-box">11:00AM 7th-November-2007</div>
            <div class="emoji-line">🎀 🎈 🎀</div>
            <button id="next-btn">Next</button>
        </div>
    </div>

    <!-- Screen 4: Final Birthday Wish -->
    <div id="scene-final" class="scene">
        <div class="final-card">
            <h1 class="final-message">Happy Birthday 🎂 Niruu 🌻</h1>
            <div class="sparkles">✨ 🌻 🎀 🌻 ✨</div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const sceneCountdown = document.getElementById('scene-countdown');
            const sceneBoom = document.getElementById('scene-boom');
            const sceneReveal = document.getElementById('scene-reveal');
            const sceneFinal = document.getElementById('scene-final');

            const mainTimer = document.getElementById('main-timer');
            const waitTimer = document.getElementById('wait-timer');
            const nextBtn = document.getElementById('next-btn');
            const bgStage = document.getElementById('bg-stage');

            // 1. 10-Second Countdown
            let timeLeft = 10;
            const timerInterval = setInterval(() => {
                timeLeft--;
                mainTimer.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showBoomScene();
                }
            }, 1000);

            // 2. Boom Effect + 3-Second Countdown
            function showBoomScene() {
                sceneCountdown.classList.remove('active');
                sceneBoom.classList.add('active');

                let pauseLeft = 3;
                const pauseInterval = setInterval(() => {
                    pauseLeft--;
                    if (pauseLeft > 0) {
                        waitTimer.textContent = pauseLeft;
                    } else {
                        clearInterval(pauseInterval);
                        showRevealScene();
                    }
                }, 1000);
            }

            // 3. Date Reveal + Floating Background
            function showRevealScene() {
                sceneBoom.classList.remove('active');
                sceneReveal.classList.add('active');
                startFloatingEmojis();
            }

            // 4. Next Button Click -> Final Screen
            nextBtn.addEventListener('click', () => {
                sceneReveal.classList.remove('active');
                sceneFinal.classList.add('active');
            });

            // Floating Sunflowers & Balloons
            function startFloatingEmojis() {
                for (let i = 0; i < 16; i++) {
                    const flower = document.createElement('div');
                    flower.textContent = '🌻';
                    flower.className = 'floating sunflower';
                    flower.style.left = (Math.random() * 92 + 2) + 'vw';
                    flower.style.animationDuration = (Math.random() * 6 + 10) + 's';
                    flower.style.animationDelay = (Math.random() * 5) + 's';
                    bgStage.appendChild(flower);
                }

                for (let i = 0; i < 9; i++) {
                    const balloon = document.createElement('div');
                    balloon.textContent = '🎈';
                    balloon.className = 'floating balloon';
                    balloon.style.left = (Math.random() * 90 + 4) + 'vw';
                    balloon.style.animationDuration = (Math.random() * 5 + 8) + 's';
                    balloon.style.animationDelay = (Math.random() * 4) + 's';
                    bgStage.appendChild(balloon);
                }
            }
        });
    </script>
</body>
</html>
